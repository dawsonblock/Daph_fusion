# Daph_fusion Workflow Add Or Correct Task Arithmetic Operator

## Action

Follow the add-or-correct-task-arithmetic-operator workflow:
1. Implement or fix the operator logic in a new or existing file under daph_exfusion/merge/
2. Update the pipeline (e.g., pipeline_v3.py) to use the new or corrected operator
3. Export the operator in daph_exfusion/merge/__init__.py
4. Add or update tests in tests/ (e.g., test_v3_corrected_dense_merge.py)
5. Update or add CI workflow for validation and packaging

